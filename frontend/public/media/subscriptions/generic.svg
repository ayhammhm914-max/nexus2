<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071827" />
      <stop offset="48%" stop-color="#050815" />
      <stop offset="100%" stop-color="#02030A" />
    </linearGradient>
    <radialGradient id="glow1" cx="28%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#00D4FF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="78%" r="70%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.30" />
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.56" />
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)" />
  <rect width="900" height="1200" fill="url(#glow1)" />
  <rect width="900" height="1200" fill="url(#glow2)" />
  <rect width="900" height="1200" fill="url(#grid)" opacity="0.35" />

  <g filter="url(#cardShadow)">
    <rect x="84" y="96" width="732" height="1008" rx="64" fill="#0B1020" fill-opacity="0.74" stroke="#FFFFFF" stroke-opacity="0.12" />
  </g>

  <rect x="120" y="140" width="660" height="44" rx="22" fill="#050815" fill-opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.10" />
  <text x="152" y="170" fill="#00D4FF" font-family="Arial, sans-serif" font-size="22" letter-spacing="6" font-weight="700">DIGITAL PRODUCT</text>

  <g transform="translate(120 230)">
    <rect x="0" y="0" width="176" height="176" rx="44" fill="#00D4FF" fill-opacity="0.12" stroke="#00D4FF" stroke-opacity="0.45" />
    <path d="M60 66h56v12H60V66z" fill="#00D4FF" opacity="0.92" />
    <path d="M82 44h12v56H82V44z" fill="#00D4FF" opacity="0.92" />
    <path d="M60 110h56v12H60v-12z" fill="#7C3AED" opacity="0.65" />
  </g>

  <text x="120" y="500" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="1">Subscription</text>
  <text x="120" y="562" fill="#D6E6FF" font-family="Arial, sans-serif" font-size="32" font-weight="500">Instant delivery as a secure digital code.</text>

  <rect x="120" y="640" width="310" height="58" rx="29" fill="#00D4FF" fill-opacity="0.16" stroke="#00D4FF" stroke-opacity="0.45" />
  <text x="160" y="679" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2">INSTANT DELIVERY</text>

  <rect x="120" y="738" width="660" height="2" fill="#FFFFFF" fill-opacity="0.10" />

  <text x="120" y="816" fill="#AFC3FF" font-family="Arial, sans-serif" font-size="26">Premium storefront. Single-seller stock.</text>
  <text x="120" y="860" fill="#AFC3FF" font-family="Arial, sans-serif" font-size="22" opacity="0.9">Secure checkout and clear redemption steps.</text>

  <g opacity="0.92">
    <rect x="120" y="946" width="352" height="56" rx="28" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
    <text x="152" y="982" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">NEXUS VERIFIED STOCK</text>
  </g>
</svg>
