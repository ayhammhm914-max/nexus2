<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B3A21" />
      <stop offset="55%" stop-color="#050815" />
      <stop offset="100%" stop-color="#02030A" />
    </linearGradient>
    <radialGradient id="glow" cx="54%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#1DB954" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#1DB954" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1DB954" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="badgeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.113 0 0 0 0 0.725 0 0 0 0 0.329 0 0 0 0.75 0" />
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)" />
  <rect width="900" height="1200" fill="url(#glow)" />
  <rect width="900" height="1200" fill="url(#grid)" opacity="0.35" />

  <g filter="url(#cardShadow)">
    <rect x="84" y="96" width="732" height="1008" rx="64" fill="#0B1020" fill-opacity="0.74" stroke="#FFFFFF" stroke-opacity="0.12" />
  </g>

  <rect x="120" y="140" width="660" height="44" rx="22" fill="#050815" fill-opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.10" />
  <text x="152" y="170" fill="#1DB954" font-family="Arial, sans-serif" font-size="22" letter-spacing="6" font-weight="700">SUBSCRIPTION CARD</text>

  <g transform="translate(120 230)">
    <circle cx="88" cy="88" r="88" fill="#1DB954" fill-opacity="0.16" stroke="#1DB954" stroke-opacity="0.55" />
    <circle cx="88" cy="88" r="70" fill="#050815" fill-opacity="0.55" />
    <path d="M54 88c28-10 58-6 84 10" stroke="#1DB954" stroke-width="10" stroke-linecap="round" opacity="0.92" />
    <path d="M58 116c24-8 49-5 70 8" stroke="#1DB954" stroke-width="10" stroke-linecap="round" opacity="0.78" />
    <path d="M62 142c18-6 36-4 52 5" stroke="#1DB954" stroke-width="10" stroke-linecap="round" opacity="0.62" />
  </g>

  <text x="120" y="510" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="1">Spotify Premium</text>
  <text x="120" y="572" fill="#D6E6FF" font-family="Arial, sans-serif" font-size="32" font-weight="500">Instant digital access. Redeem and start listening.</text>

  <g filter="url(#badgeGlow)">
    <rect x="120" y="640" width="262" height="58" rx="29" fill="#1DB954" fill-opacity="0.18" stroke="#1DB954" stroke-opacity="0.55" />
  </g>
  <text x="160" y="679" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2">INSTANT DELIVERY</text>

  <rect x="120" y="738" width="660" height="2" fill="#FFFFFF" fill-opacity="0.10" />

  <text x="120" y="816" fill="#AFC3FF" font-family="Arial, sans-serif" font-size="26">Official digital product from one verified source.</text>
  <text x="120" y="860" fill="#AFC3FF" font-family="Arial, sans-serif" font-size="22" opacity="0.9">Secure checkout. Clear redemption steps. Premium support.</text>

  <g opacity="0.9">
    <rect x="120" y="946" width="352" height="56" rx="28" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
    <text x="152" y="982" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">NEXUS VERIFIED STOCK</text>
  </g>

  <circle cx="768" cy="248" r="140" fill="#1DB954" fill-opacity="0.10" />
  <circle cx="812" cy="980" r="170" fill="#7C3AED" fill-opacity="0.10" />
</svg>
